services:
  - type: web
    name: seen-qaf-api
    runtime: node
    plan: free
    buildCommand: echo ok
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  - type: web
    name: seen-qaf
    runtime: static
    buildCommand: echo ok
    staticPublishPath: frontend
